<header class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-slate-200 bg-white/80 px-6 backdrop-blur">
  <div class="flex items-center gap-3">
    <button class="lg:hidden rounded-lg p-2 text-slate-500 hover:bg-slate-100" onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')">
      <i class="ri-menu-line text-xl"></i>
    </button>
    <p class="font-semibold">{% block page_title %}Dashboard{% endblock %}</p>
  </div>
  <div class="flex items-center gap-3">
    <span class="hidden sm:inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-3 py-1 text-xs font-medium text-emerald-700">
      <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>{{ company.name|default:'OptiCore' }}
    </span>
    <div class="relative">
      <button class="flex items-center gap-2 rounded-lg border border-slate-200 px-3 py-1.5 text-sm hover:bg-slate-50" onmouseover="document.getElementById('userMenu').classList.remove('hidden')" onmouseout="setTimeout(()=>document.getElementById('userMenu').classList.add('hidden'),400)">
        <span class="grid h-7 w-7 place-items-center rounded-full bg-indigo-600 text-xs font-semibold text-white uppercase">{{ request.user.get_full_name|default:request.user.username|slice:":2" }}</span>
        <span class="hidden md:inline">{{ request.user.get_full_name|default:request.user.username }}</span>
        <i class="ri-arrow-down-s-line"></i>
      </button>
      <div id="userMenu" class="hidden absolute right-0 mt-2 w-52 rounded-xl border border-slate-200 bg-white p-1 text-sm shadow-lg" onmouseleave="this.classList.add('hidden')">
        <a href="{% url 'core:profile' %}" class="block rounded-lg px-3 py-2 hover:bg-slate-50"><i class="ri-user-line mr-2"></i>My profile</a>
        <form method="post" action="{% url 'core:logout' %}">{% csrf_token %}<button class="block w-full rounded-lg px-3 py-2 text-left text-red-600 hover:bg-red-50"><i class="ri-logout-box-r-line mr-2"></i>Sign out</button></form>
      </div>
    </div>
  </div>
</header>
