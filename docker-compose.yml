version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    environment:
      DATABASE_URL: postgres://erp:erp_secret@db:5432/erp
      SECRET_KEY: change-me-in-production
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  pgdata:
